# Глоссарий терминов справочника.
# Формат каждой записи:
#   id:         латиницей, уникальный (используется в ссылках)
#   term:       термин так, как он пишется в тексте
#   aliases:    другие формы и синонимы, которые тоже станут ссылками в статьях (необязательно)
#   definition: простое определение в 1–3 предложения
#   articles:   id статей, где термин раскрыт подробнее
# В статьях ссылкой становится первое упоминание термина (в любой грамматической форме).

- id: denaturation
  term: "Денатурация"
  aliases: [денатурировать, денатурирует]
  definition: "Изменение пространственной формы белка — его цепочка разворачивается, хотя сама не рвётся. После денатурации белок теряет прежние свойства и легко слипается с соседними. Её вызывают нагрев, кислота, соль, взбивание."
  articles: [c1, c8, c3]

- id: coagulation
  term: "Коагуляция"
  aliases: [свёртывание белка]
  definition: "Слипание денатурированных белков в сеть или сгусток. Так яичный белок становится белым и упругим, а молоко сворачивается в творог или йогурт."
  articles: [c8, f1, c1]

- id: myosin
  term: "Миозин"
  definition: "Главный белок толстых нитей мышечного волокна. При нагреве мяса он денатурирует одним из первых — примерно при 50–60 °C, — и волокна начинают сжиматься в толщину."
  articles: [c1, c4]

- id: actin
  term: "Актин"
  definition: "Белок тонких нитей мышечного волокна. Денатурирует позже миозина — около 70–80 °C; после этого постное мясо становится плотным и сухим."
  articles: [c1]

- id: collagen
  term: "Коллаген"
  definition: "Главный белок соединительной ткани — сухожилий, плёнок и прослоек в мясе. Молекула коллагена — тройная спираль; при долгом влажном нагреве она распадается, и коллаген переходит в желатин."
  articles: [c3, c1, c7]

- id: gelatin
  term: "Желатин"
  definition: "Растворённый коллаген. В горячей жидкости он растворяется, а при остывании образует упругий гель — поэтому крепкий бульон застывает в холодец."
  articles: [c3, b5, d3]

- id: maillard
  term: "Реакция Майяра"
  aliases: [Майяр]
  definition: "Цепочка реакций между аминокислотами (белками) и сахарами при нагреве. Она даёт румяный цвет и аромат корочки хлеба, жареного мяса, кофе. Быстро идёт на сухой горячей поверхности."
  articles: [b1, c2, h1]

- id: caramelization
  term: "Карамелизация"
  definition: "Распад самих сахаров при сильном нагреве, без участия белков. Даёт цвет и вкус карамели; сахароза карамелизуется примерно со 160 °C."
  articles: [b1, b2]

- id: melanoidins
  term: "Меланоидины"
  definition: "Коричневые азотсодержащие вещества, которые образуются на последних стадиях реакции Майяра и дают цвет корочке."
  articles: [b1]

- id: acrylamide
  term: "Акриламид"
  definition: "Нежелательное вещество, которое образуется в крахмалистых продуктах (картофель, хлеб) при сильном нагреве из аминокислоты аспарагина и сахаров. Его меньше, если жарить до золотистого, а не тёмного цвета."
  articles: [b1]

- id: gluten
  term: "Клейковина"
  aliases: [глютен]
  definition: "Упругая сеть из белков пшеницы — глютенинов и глиадинов, которая образуется, когда мука впитывает воду. Она удерживает газ, и тесто поднимается."
  articles: [a1, a7, h5]

- id: glutenin
  term: "Глютенин"
  definition: "Белки клейковины, которые образуют огромные сшитые цепи и дают тесту упругость — способность пружинить и держать форму."
  articles: [a1]

- id: gliadin
  term: "Глиадин"
  definition: "Белки клейковины, которые встраиваются между цепями глютенина и отвечают за растяжимость и вязкость теста."
  articles: [a1]

- id: autolysis
  term: "Аутолиз"
  definition: "В хлебопечении — приём, когда муку смешивают с водой и оставляют на 20–60 минут до добавления соли и закваски. Мука успевает впитать воду, и клейковина начинает собираться без замеса."
  articles: [a1, a7, h5]

- id: bran
  term: "Отруби"
  definition: "Оболочки зерна, богатые пищевыми волокнами. В цельнозерновой муке они забирают воду и мешают клейковине удерживать газ, поэтому такой хлеб плотнее."
  articles: [a7]

- id: gelatinization
  term: "Клейстеризация"
  aliases: [желатинизация крахмала]
  definition: "Набухание и разрушение упорядоченной структуры крахмальных зёрен при нагреве в воде. Так крахмал загущает соусы и кисели, а мякиш хлеба становится мягким."
  articles: [d2, a6]

- id: retrogradation
  term: "Ретроградация"
  definition: "Повторная кристаллизация клейстеризованного крахмала при остывании и хранении. Главная причина черствения хлеба; быстрее всего идёт при температуре холодильника."
  articles: [a6]

- id: amylopectin
  term: "Амилопектин"
  definition: "Разветвлённая молекула крахмала. Его медленная перекристаллизация в течение дней — основная причина черствения хлеба."
  articles: [a6, d2]

- id: amylose
  term: "Амилоза"
  definition: "Линейная молекула крахмала. Быстро выстраивается в структуру в первые часы после выпечки и задаёт исходную упругость мякиша."
  articles: [a6, d2]

- id: emulsion
  term: "Эмульсия"
  definition: "Мелкие капли одной жидкости, распределённые в другой, с которой она не смешивается, — например, масла в воде. Майонез, голландский соус и винегрет — эмульсии."
  articles: [d1, h4]

- id: emulsifier
  term: "Эмульгатор"
  definition: "Вещество, которое встаёт на границу масла и воды и защищает капли от слияния. В кулинарии это лецитин и белки желтка, горчица, белки молока."
  articles: [d1]

- id: lecithin
  term: "Лецитин"
  definition: "Фосфолипиды — природные эмульгаторы, которых много в яичном желтке. Одна часть молекулы тянется к воде, другая — к маслу."
  articles: [d1]

- id: pectin
  term: "Пектин"
  definition: "Вещество клеточных стенок растений, которое склеивает соседние клетки. При варке он распадается, и овощи размягчаются; в варенье пектин с сахаром и кислотой образует гель."
  articles: [d5, b5]

- id: pasteurization
  term: "Пастеризация"
  definition: "Нагрев, который снижает число болезнетворных бактерий до безопасного уровня, но не уничтожает все микробы и их споры. Результат зависит и от температуры, и от времени выдержки."
  articles: [c5, f5]

- id: spores
  term: "Споры"
  definition: "Покоящиеся формы некоторых бактерий с прочной оболочкой. Они переживают кипячение и прорастают, когда еда остывает; поэтому готовую еду нужно быстро охлаждать."
  articles: [f5, f4]

- id: danger-zone
  term: "Опасная зона"
  definition: "Диапазон примерно от 4 до 60 °C, в котором бактерии быстро размножаются. Готовую еду не держат в нём дольше 2 часов."
  articles: [f4, f5]

- id: water-activity
  term: "Активность воды"
  definition: "Доля воды в продукте, доступная микробам и химическим реакциям. Соль, сахар и сушка её снижают и тем самым консервируют продукт."
  articles: [f4, b1]

- id: ph
  term: "pH"
  definition: "Мера кислотности. Чем ниже pH, тем кислее среда; при pH 4,6 и ниже не прорастают споры ботулизма, поэтому кислота — один из барьеров консервирования."
  articles: [f4, f1, b1]

- id: botulism
  term: "Ботулизм"
  aliases: [Clostridium botulinum]
  definition: "Тяжёлое отравление токсином бактерии Clostridium botulinum. Её споры прорастают без кислорода в некислых продуктах — в домашних консервах, масле с чесноком."
  articles: [f4]

- id: lactic-fermentation
  term: "Молочнокислое брожение"
  aliases: [молочнокислые бактерии]
  definition: "Превращение сахаров в молочную кислоту молочнокислыми бактериями. Так квасят овощи и делают йогурт и кефир."
  articles: [f1]

- id: polyphenol-oxidase
  term: "Полифенолоксидаза"
  definition: "Фермент плодов, который при доступе воздуха окисляет фенольные вещества, и срез яблока, авокадо или картофеля темнеет."
  articles: [f3]

- id: lipid-oxidation
  term: "Окисление жиров"
  aliases: [прогоркание]
  definition: "Цепная реакция ненасыщенных жиров с кислородом, которая даёт прогорклый запах. Ускоряется светом, теплом и металлами."
  articles: [f3]

- id: calpains
  term: "Кальпаины"
  definition: "Ферменты мышцы, которые после убоя разрушают белки, скрепляющие мышечные волокна. Благодаря им мясо при созревании становится мягче."
  articles: [c6]

- id: rigor-mortis
  term: "Окоченение"
  aliases: [rigor mortis]
  definition: "Состояние мышцы после убоя, когда белки актин и миозин сцепляются и мясо становится самым жёстким. Проходит за время созревания."
  articles: [c6]

- id: ovalbumin
  term: "Овальбумин"
  definition: "Главный белок яичного белка. Сворачивается около 80 °C — поэтому белок становится по-настоящему твёрдым только при сильном нагреве."
  articles: [c8]

- id: umami
  term: "Умами"
  definition: "Пятый базовый вкус — вкус глутамата и некоторых нуклеотидов. Много его в пармезане, томатах, грибах, соевом соусе."
  articles: [e2, e5]

- id: retronasal
  term: "Ретроназальное обоняние"
  definition: "Восприятие запахов еды изнутри рта: летучие вещества поднимаются к носу через носоглотку. Большая часть того, что мы называем вкусом блюда, — это аромат."
  articles: [e1]

- id: conduction
  term: "Теплопроводность"
  definition: "Передача тепла через вещество от более горячих частей к более холодным без движения самого вещества. Металлы проводят тепло хорошо, мясо и воздух — плохо."
  articles: [g1, g3, g4]

- id: convection
  term: "Конвекция"
  definition: "Перенос тепла движущейся жидкостью или газом. Вентилятор в духовке усиливает конвекцию и ускоряет нагрев."
  articles: [g1]

- id: thermal-diffusivity
  term: "Температуропроводность"
  definition: "Скорость, с которой выравнивается температура внутри продукта. Из-за неё время прогрева центра растёт примерно как квадрат толщины куска."
  articles: [g4]

- id: latent-heat
  term: "Теплота парообразования"
  aliases: [испарение воды, скрытая теплота]
  definition: "Энергия, нужная, чтобы превратить жидкость в пар. Для воды — около 2260 Дж на грамм, поэтому мокрая поверхность не нагревается выше 100 °C."
  articles: [g2]

- id: leidenfrost
  term: "Эффект Лейденфроста"
  definition: "Когда поверхность намного горячее точки кипения, капля воды не растекается, а катается по ней на подушке пара. У воды на металле это примерно 200 °C."
  articles: [g3]

- id: carryover
  term: "Остаточный нагрев"
  definition: "Рост температуры в центре куска после снятия с огня: тепло продолжает перетекать от горячих внешних слоёв к середине."
  articles: [g4, c1]

- id: cereulide
  term: "Цереулид"
  definition: "Рвотный токсин бактерии Bacillus cereus, который образуется в рисе и других гарнирах, долго стоявших в тепле. Не разрушается при разогреве."
  articles: [f5]
