<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F3">
<title>Кухня: наука вкуса</title>
<style>
:root {
  --bg:#F7F3EB;--surface:#FBF8F1;--surface-alt:#EAE2D5;--text:#29271F;--text-muted:#766B5C;
  --primary:#8F5A33;--primary-soft:#F0E2D3;--secondary:#6F795A;--secondary-soft:#E4E7D8;
  --border:#DDD3C2;--warn:#8A5A0B;--warn-soft:#F6EBD0;--danger:#A33B35;--danger-soft:#F5E1DD;
  --tint-phys:#E3E7E3;--shadow:none;--radius:14px;--font-scale:1;
  --serif:Georgia,"Noto Serif","Times New Roman",serif;--mono:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
[data-theme="dark"] {
  --bg:#1C1814;--surface:#251F1A;--surface-alt:#302922;--text:#EFE8DC;--text-muted:#AFA391;
  --primary:#D9A67A;--primary-soft:#3A2C20;--secondary:#A3AF8A;--secondary-soft:#2A2E22;
  --border:#3D352C;--warn:#E0B04F;--warn-soft:#3A3020;--danger:#E58A80;--danger-soft:#3C2522;--tint-phys:#26302E;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: calc(16px * var(--font-scale));
  line-height: 1.55;
  overscroll-behavior-y: none;
}
header.app-bar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-title {
  font-weight: 800; font-size: 1.15rem; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.app-title span.badge {
  font-size: 0.7rem; background: var(--primary-soft); color: var(--primary);
  padding: 2px 8px; border-radius: 99px; font-weight: 700;
}
.icon-btn {
  background: var(--surface-alt); border: 1px solid var(--border);
  color: var(--text); border-radius: 12px; padding: 8px 11px;
  font-size: 0.9rem; font-weight: 600; cursor: pointer;
}
main#app-Main {
  padding: 14px 16px 96px 16px;
  max-width: 680px; margin: 0 auto;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-clickable { cursor: pointer; transition: transform 0.12s ease; }
.card-clickable:active { transform: scale(0.985); }
.section-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
}
@media (max-width: 360px) { .section-grid { grid-template-columns: 1fr; } }
.sec-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; box-shadow: var(--shadow);
}
.sec-card:active { transform: scale(0.98); }
.sec-letter {
  display: inline-block; width: 28px; height: 28px; line-height: 28px;
  text-align: center; border-radius: 8px;
  background: var(--primary-soft); color: var(--primary);
  font-weight: 800; font-size: 0.85rem; margin-bottom: 8px;
}
.sec-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; line-height: 1.25; }
.sec-meta { font-size: 0.76rem; color: var(--text-muted); }
.tag {
  display: inline-block; padding: 3px 9px; border-radius: 99px;
  font-size: 0.74rem; font-weight: 600; margin-right: 6px; margin-bottom: 4px;
  background: var(--surface-alt); color: var(--text-muted);
}
.tag.olive { background: var(--secondary-soft); color: var(--secondary); }
.tag.terra { background: var(--primary-soft); color: var(--primary); }
.search-box {
  width: 100%; padding: 13px 15px; border-radius: 14px;
  border: 1.5px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 0.98rem; margin-bottom: 12px; outline: none;
}
.search-box:focus { border-color: var(--primary); }
.pill-bar {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px;
  scrollbar-width: none;
}
.pill-bar::-webkit-scrollbar { display: none; }
.pill {
  white-space: nowrap; padding: 7px 14px; border-radius: 99px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-muted); font-size: 0.84rem; font-weight: 600; cursor: pointer;
}
.pill.active {
  background: var(--primary); color: #FFF; border-color: var(--primary);
}
.art-block {
  margin-bottom: 14px; padding: 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--border);
}
.art-block h4 {
  margin: 0 0 6px 0; font-size: 0.92rem; text-transform: uppercase;
  letter-spacing: 0.03em; color: var(--primary);
}
.art-block.olive h4 { color: var(--secondary); }
.art-block.warn { background: var(--warn-soft); border-color: var(--warn); }
.art-block.warn h4 { color: var(--warn); }
.art-block.Summary { background: var(--secondary-soft); border-color: var(--secondary); }
.art-block.Summary h4 { color: var(--secondary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 16px; border-radius: 12px; font-weight: 700; font-size: 0.9rem;
  border: none; cursor: pointer; background: var(--primary); color: #FFF;
}
.btn.secondary { background: var(--secondary); color: #FFF; }
.btn.outline {
  background: transparent; color: var(--text); border: 1.5px solid var(--border);
}
.btn.full { width: 100%; }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
  background: var(--surface); border-top: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-item {
  background: none; border: none; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 0.68rem; font-weight: 600; padding: 4px 2px; cursor: pointer;
}
.nav-item .nav-ic { font-size: 1.2rem; line-height: 1; }
.nav-item.active { color: var(--primary); font-weight: 800; }
.progress-bar {
  width: 100%; height: 8px; background: var(--surface-alt);
  border-radius: 99px; overflow: hidden; margin: 8px 0;
}
.progress-fill {
  height: 100%; background: var(--secondary); transition: width 0.25s ease;
}
.input-row {
  display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 6px;
  margin-bottom: 8px; align-items: center;
}
input.field, select.field, textarea.field {
  width: 100%; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 0.92rem;
}
table.comp-table {
  width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px;
}
table.comp-table th, table.comp-table td {
  border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top;
}
table.comp-table th { background: var(--surface-alt); font-weight: 700; }
.quiz-opt {
  display: block; width: 100%; text-align: left; padding: 11px 14px;
  margin-bottom: 8px; border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 0.9rem; cursor: pointer;
}
.quiz-opt.correct { background: var(--secondary-soft); border-color: var(--secondary); font-weight: 700; }
.quiz-opt.wrong { background: var(--danger-soft); border-color: var(--danger); }
@media (max-width:400px){.input-row{grid-template-columns:1fr 1fr 1fr auto}.input-row>:first-child{grid-column:1/-1}}
.btn,.icon-btn,.quiz-opt{min-height:44px}.pill{min-height:40px}.nav-item{min-height:48px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
[data-theme="dark"] .btn:not(.outline),[data-theme="dark"] .pill.active{color:#1B1210}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
#toast.show{opacity:1}.calc-out{overflow-wrap:anywhere}.err{color:var(--danger);font-size:.82rem;min-height:1.2em}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.calc-out strong{font-size:1.2rem}
/* ===== Редизайн v3: журнал + лаборатория ===== */
body{letter-spacing:.005em}
h1,h2,h3{font-family:var(--serif)}
.ic{width:1.3em;height:1.3em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:none}
header.app-bar{padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}.brand b{display:block;font:700 1.2rem/1.05 var(--serif)}.brand .s{font-size:.78rem;color:var(--text-muted)}.mark-ic{color:var(--secondary)}
.card{box-shadow:none;border-radius:14px}.card-clickable:active{transform:none;background:var(--surface-alt)}
.screen-title{font:700 1.7rem/1.15 var(--serif);margin:6px 0 2px}.sub{color:var(--text-muted);margin:0 0 14px;font-size:.92rem}
.btn{background:var(--secondary);color:#fff;border-radius:12px}.btn.secondary{background:var(--primary)}.btn.outline{background:transparent;color:var(--text)}
.pill.active{background:var(--secondary);border-color:var(--secondary);color:#fff}
.nav-item .ic{width:24px;height:24px}.nav-item.active{color:var(--secondary)}
.bottom-nav{border-top:1px solid var(--border)}
.cover{position:relative;border-radius:18px;overflow:hidden;background:#2A241C;color:#F4EDE0;min-height:360px;margin-bottom:14px}
.cover .crumb{position:absolute;inset:0;width:100%;height:100%;stroke:none;stroke-width:initial}
.cover-body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:rgba(24,18,12,.62)}
.mark{align-self:flex-start;font:700 .68rem var(--mono);letter-spacing:.08em;padding:3px 8px;border:1px solid #D9A67A;color:#EBC9A5;border-radius:4px;margin-bottom:10px}
.cover h2{font:700 1.8rem/1.12 var(--serif);margin:0 0 8px;color:#fff}.cover p{margin:0 0 14px;font-size:.93rem;color:#E6DCCB}
.cover-foot{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:#E6DCCB}.cover .btn{background:#A3AF8A;color:#1B1710}
.searchbar{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text-muted);font:inherit;cursor:pointer;text-align:left}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}.eyebrow h3{margin:0;font-size:1.2rem}
.link{background:none;border:none;color:var(--primary);font:600 .85rem inherit;cursor:pointer;min-height:44px;padding:0 4px}.mono-s{font:.8rem var(--mono);color:var(--text-muted)}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dir{text-align:left;border:none;border-radius:14px;padding:14px;color:var(--text);display:flex;flex-direction:column;gap:4px;min-height:116px;font:inherit;cursor:pointer}
.dir b{font:700 1rem/1.2 var(--serif)}.dir span{font-size:.78rem;color:var(--text-muted)}.dir .ic{width:26px;height:26px;margin-bottom:6px;color:var(--secondary)}
.t-chem{background:var(--secondary-soft)}.t-phys{background:var(--tint-phys)}.t-tech{background:var(--primary-soft)}.t-exp{background:var(--surface-alt)}
.list{border-top:1px solid var(--border)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;border:none;border-bottom:1px solid var(--border);background:none;color:var(--text);text-align:left;font:inherit;cursor:pointer;min-height:60px}
.row .ic{color:var(--secondary)}.row b{display:block;font-size:.97rem}.row small{color:var(--text-muted);font-size:.8rem}.row .go{margin-left:auto;color:var(--text-muted)}
.card-ed{display:flex;gap:12px;align-items:flex-start}.tile{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--secondary)}
.ed-t{font:700 1.04rem/1.25 var(--serif);margin:0 0 4px}.ed-d{font-size:.85rem;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ed-m{font:.74rem var(--mono);color:var(--text-muted);margin-top:6px}
.art-head{margin:4px 0 20px}.kicker{font:600 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--primary)}
.art-head h2{font:700 1.75rem/1.15 var(--serif);margin:8px 0 14px}
.lead{border-left:3px solid var(--primary);padding:2px 0 2px 14px;font-size:1.02rem;max-width:62ch}
.lead .lbl{display:block;font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:4px}
.art-block{background:none;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:0 0 16px;margin-bottom:18px;max-width:62ch}
.art-block h4{font:700 1.2rem/1.25 var(--serif);text-transform:none;letter-spacing:0;color:var(--text);margin:0 0 6px}
.art-block.olive{background:var(--secondary-soft);border:none;border-radius:14px;padding:14px}
.art-block.warn{background:var(--warn-soft);border:1px solid var(--warn);border-radius:14px;padding:14px}.art-block.warn h4{color:var(--warn)}
.art-block.Summary{background:var(--surface-alt);border:none;border-radius:14px;padding:14px}.art-block.Summary h4{color:var(--text)}
.seg{display:inline-flex;background:var(--surface-alt);border-radius:99px;padding:3px}
.seg button{border:none;background:none;color:var(--text);padding:8px 16px;border-radius:99px;min-height:40px;font:600 .88rem inherit;cursor:pointer}.seg button.on{background:var(--secondary);color:#fff}
[data-theme="dark"] .seg button.on{color:#1B1710}
input[type=number].field,.calc-out,#bTotal{font-family:var(--mono)}
input.field,select.field,textarea.field{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;min-height:44px}
.note{background:var(--surface);border-left:4px solid var(--primary);border-radius:6px 14px 14px 6px}
.search-box{background:var(--surface);min-height:48px}

</style>

<script>
// ==================== 1. НАУЧНАЯ БАЗА ДАННЫХ (36 СТАТЕЙ, 8 РАЗДЕЛОВ) ====================
const SECTIONS = [
  { id: 'A', letter: 'А', title: 'Выпечка и тесто', desc: 'Клейковина, брожение, закваски, виды теста и физика печного подъёма' },
  { id: 'B', letter: 'Б', title: 'Десерты и кондитерская химия', desc: 'Карамелизация, сиропы, темперирование шоколада, пены и гидроколлоиды' },
  { id: 'C', letter: 'В', title: 'Мясо, птица и рыба', desc: 'Денатурация белков, сочность, реакция Майяра, коллаген и рассолы' },
  { id: 'D', letter: 'Г', title: 'Соусы, супы и текстуры', desc: 'Эмульсии, желатинизация крахмала, экстракция бульонов и реология' },
  { id: 'E', letter: 'Д', title: 'Химия вкуса и аромата', desc: 'Рецепторы, ретроназальное обоняние, баланс 5 вкусов и летучие эфиры' },
  { id: 'F', letter: 'Е', title: 'Ферментация и хранение', desc: 'Лактоферментация, кристаллы льда, окисление липидов и безопасность' },
  { id: 'G', letter: 'Ж', title: 'Физика кухни', desc: 'Теплопроводность, конвекция, испарение, теплоёмкость посуды и инерция' },
  { id: 'H', letter: 'З', title: 'Кулинарная лаборатория', desc: 'Управляемые домашние эксперименты с контролем температуры, pH и соли' }
];

const ARTICLES = [
  // --- РАЗДЕЛ А: ВЫПЕЧКА И ТЕСТО ---
  {
    id: 'a1', sec: 'A', title: 'Формирование клейковины и развитие глютеновой сетки',
    idea: 'Клейковина (глютен) не содержится в сухой муке в готовом виде — она образуется только при гидратации белков глиадина и глютенина и их механическом или временном выстраивании в вязкоупругую сеть.',
    what: 'При добавлении воды к пшеничной муке два нерастворимых запасных белка — мономерный глиадин и полимерный глютенин — поглощают до двукратной массы воды. В процессе замеса или аутолиза между цепочками глютенина образуются дисульфидные (-S-S-) и водородные связи.',
    why: 'Глиадин отвечает за растяжимость и текучесть теста (способность надуваться без разрыва), а глютенин — за упругость и прочность (способность удерживать форму и пузырьки углекислого газа). Механическое растяжение разворачивает скрученные белковые молекулы и выстраивает их вдоль линий натяжения.',
    factors: 'Гидратация (оптимум для хлеба 60–75%), содержание белка в муке (7–9% для бисквитов и пирожных, 12–14% для подового хлеба), соль (укрепляет сеть, экранируя одноимённые электрические заряды на белках), жиры и сахар (обволакивают белки и конкурируют за воду, тормозя развитие глютена).',

  {

    what: 'При уваривании (редукции) вина, сливок или бульона улетают вода, этанол и лёгкие летучие эфиры, в то время как масса минеральных солей, кислот, белков и желатина остаётся неизменной в меньшем объёме.',
    why: 'Сливки жирностью 33% можно смело кипятить и уваривать — высокая концентрация жировых глобул и мембранных белков не даёт казеину свернуться в хлопья. Но сметана (15–20%) или молоко в кислом томатном или винном соусе при кипячении мгновенно сворачиваются, так как в кислой среде (pH около 4.6 — изоэлектрическая точка казеина) белки теряют заряд и слипаются.',
    factors: 'Температура и жирность при монтировании соуса сливочным маслом (Monter au beurre): холодные кубики масла вводят в соус, снятый с огня (при 55–65°C), непрерывно вращая сотейник.',
    practice: 'Чтобы сметана 15–20% не свернулась в горячем бефстроганове или подливе, смешайте её предварительно с 1 ч. л. муки или крахмала и вводите в самом конце без бурного кипячения.',
    mistakes: 'Использовать для уваривания дешёвое столовое вино с избытком кислоты и танинов (или солёный магазинный бульон): после редукции в 4 раза кислота и соль станут в 4 раза агрессивнее.',
    experiment: 'Затяните 50 мл уваренного бульона двумя способами: 1) растопите в нём 20 г масла при кипении без помешивания; 2) снимите с огня (60°C) и активно вмешайте 20 г ледяного масла кубиками. Второй даст густой глянцевый соус, первый — лужу жира сверху.',
    related: ['d1', 'd2', 'd3'],
    summary: 'Уваривайте несолёную основу, используйте сливки от 30% для кипячения в кислых соусах и монтируйте холодное масло без огня.',
    sources: 'McGee H. «On Food and Cooking» (гл. 11: Sauces); Culinary Institute of America «The Professional Chef».',
    quiz: { q: 'Почему нежирная сметана (15%) сворачивается хлопьями при кипячении в кислом соусе, а жирные сливки (33%) — нет?', opts: ['В кислой среде при нагреве казеин коагулирует, а в жирных сливках избыток жировых шариков физически блокирует слияние белковых хлопьев', 'В жирных сливках вообще нет белков', 'Сметана состоит из чистого крахмала', 'Жир понижает температуру кипения до 40°C'], a: 0, exp: 'При pH вблизи 4.6 и высокой температуре казеиновые мицеллы агрегируют; только высокая доля жира или стабилизатор (крахмал) удерживает однородность.' }

  // --- РАЗДЕЛ Д: ХИМИЯ ВКУСА И АРОМАТА ---

    idea: 'Язык различает только базовые нелетучие вкусы (сладкий, солёный, кислый, горький, умами), а 80% того, что мы называем «вкусом клубники, кофе или стейка», — это ретроназальное обоняние летучих молекул при выдохе через носоглотку.',

    why: 'Эволюционно каждый вкус решает задачу выживания: сладкий сигнализирует о быстрой энергии (углеводы), умами — о строительном белке (L-глутамат), солёный — о балансе электролитов, кислый предупреждает о незрелости или брожении, а горький (у которого 25 типов рецепторов T2R!) защищает от растительных токсинов и алкалоидов.',

    practice: 'Если блюдо кажется «плоским», хотя соли и кислоты достаточно, ему не хватает не базового вкуса, а верхних летучих нот для ретроназального обоняния: добавьте при подаче цедру цитруса, свежую зелень или несколько капель ароматного нерафинированного масла.',

    sources: 'Shepherd G.M. «Neurogastronomy: How the Brain Creates Flavor and Why It Matters» (Columbia University Press).',
    quiz: { q: 'Через какой физиологический механизм человек воспринимает тонкие оттенки ванили, жареного кофе или базилика во время еды?', opts: ['Через ретроназальное обоняние — движение летучих молекул из ротовой полости в носоглотку при жевании и выдохе', 'Через специальные ванильные сосочки на кончике языка', 'Через барабанную перепонку', 'Через рецепторы солёного вкуса'], a: 0, exp: 'Обонятельные рецепторы распознают тысячи летучих молекул, попадающих из рта в носовую полость через хоаны при выдохе.' }

  {
    id: 'e2', sec: 'E', title: 'Матрица баланса: соль, кислота, сладость, горечь и умами',
    idea: 'Базовые вкусы взаимодействуют в мозге и на рецепторах нелинейно: соль подавляет горечь и усиливает сладость, кислота балансирует жирность и приторность, а глутамат с нуклеотидами дают восьмикратную синергию умами.',
    what: 'Ионы натрия (соль) селективно блокируют передачу сигнала от рецепторов горького вкуса T2R, благодаря чему скрытая сладость и аромат продукта выходят на передний план. Кислота стимулирует слюноотделение и расщепляет жировую плёнку на языке.',
    why: 'Синергия умами — доказанный биохимический феномен: рецептор умами (гетеродимер T1R1+T1R3) имеет основной участок связывания для L-глутамата (томаты, пармезан, соевый соус, водоросли комбу) и аллостерический карман для 5-рибонуклеотидов — инозината (мясо, рыба, курица) и гуанилата (сушёные белые грибы, шиитаке). Вместе они усиливают сигнал рецептора в 7–8 раз.',
    factors: 'Избыток соли нельзя «разбавить» сахаром без увеличения объёма, но умеренную пересоленность смягчают жиры (сливки, сливочное масло, сметана), которые обволакивают вкусовые сосочки, и кислота.',
    practice: 'Соединяйте источники глутамата и инозината/гуанилата в одном блюде: говядина + томатная паста, куриный бульон + сушёные грибы, паста с мясным рагу + пармезан, заправка «Цезарь» (пармезан + анчоусы).',
    mistakes: 'Пытаться убрать горечь крепкого эспрессо или грейпфрута ложкой сахара вместо микроскопической щепотки соли: соль блокирует рецептор горечи эффективнее и не утяжеляет вкус.',
    experiment: 'Сварите крепкий горьковатый кофе или нарежьте грейпфрут на две дольки: на одну уроните буквально 3–4 кристаллика мелкой соли. Горечь заметно отступит, а фруктово-цитрусовые ноты станут ярче.',

    sources: 'Zhang F. et al. (2008) «Molecular mechanism for the umami taste synergism», PNAS; Samin Nosrat «Salt, Fat, Acid, Heat».',

  {
    id: 'e3', sec: 'E', title: 'Роль жиров и воды в раскрытии ароматов специй и трав',
    idea: 'Большинство летучих ароматических молекул специй и пряностей гидрофобны (жирорастворимы), поэтому для их извлечения и доставки к рецепторам нужен тёплый жир, а не кипящая вода.',
    what: 'Эфирные масла кумина (зиры), кориандра, кардамона, гвоздики, корицы, чеснока и перца состоят из терпенов, фенолов и альдегидов с неполярной структурой. В воде они почти не растворяются и быстро улетучиваются с паром.',
    why: 'Растительное или топлёное масло выступает как неполярный органический растворитель: при прогреве специй в масле при 110–130°C клеточные стенки семян разрушаются, эфирные масла переходят в липидную фазу и равномерно распределяются по всему объёму блюда. Кроме того, жир на языке удерживает ароматные молекулы, обеспечивая долгое послевкусие.',
    factors: 'Разделяйте «жёсткие» и «нежные» травы: розмарин, тимьян и шалфей содержат малолетучие терпены в плотных листьях — их закладывают в начале тушения. Кинза, петрушка, укроп и зелёный базилик богаты легколетучими эфирами (линалоол, гексеналь), которые улетучиваются за 3 минуты кипения — их добавляют только при выключении огня.',
    practice: 'Используйте индийскую технику «тадка» (блуминг специй): сначала прогрейте цельные сухие специи на сухой сковороде 30–40 секунд до появления аромата, затем растолките и обжарьте в масле 20 секунд перед добавлением лука или жидкости.',
    mistakes: 'Насыпать сухую зиру, куркуму или паприку прямо в кипящую воду супа в конце варки: специи останутся плавать пыльным порошком на поверхности и будут скрипеть на зубах.',
    experiment: 'Размешайте по 1/4 ч. л. молотой паприки и зиры в ложке горячей воды и в ложке тёплого растительного масла. Масло мгновенно окрасится в рубиновый цвет (жирорастворимые каротиноиды) и раскроет глубокий пряный аромат.',
    related: ['e1', 'e2', 'e4'],
    summary: 'Сухие специи раскрывайте в тёплом масле; плотные травы (тимьян, розмарин) томят долго, а нежную зелень (базилик, кинзу) кладут в тарелку.',
    sources: 'Farrimond S. «The Science of Spice» (DK); McGee «On Food and Cooking».',
    quiz: { q: 'Почему сухие специи (зира, кориандр, куркума, паприка) рекомендуется кратковременно прогревать в масле, а не сыпать сразу в кипящую воду?', opts: ['Большинство их ароматических терпенов и пигментов жирорастворимы и переходят в масляную фазу при нагреве', 'В воде специи превращаются в соль', 'Масло полностью блокирует запах специй', 'Специи растворяются только при 250°C'], a: 0, exp: 'Неполярные эфирные масла и каротиноиды экстрагируются липидами, которые затем равномерно разносят вкус по блюду.' }

  {
    id: 'e4', sec: 'E', title: 'Как температура подачи и обжарка меняют восприятие вкуса',
    idea: 'Чувствительность вкусовых рецепторов человека максимальна в диапазоне 20–35°C: ледяная еда кажется менее сладкой и ароматной, а обжигающе горячая скрывает тонкие оттенки под температурным сигналом.',
    what: 'Кальциевые ионные каналы TRPM5 во вкусовых клетках языка, отвечающие за передачу сигнала сладкого, горького и умами в мозг, сильно зависят от температуры: при 15°C их проводимость в 3–4 раза ниже, чем при 35°C.',
    why: 'Именно поэтому растаявшее при комнатной температуре мороженое или тёплый лимонад кажутся приторно-сладкими (в них закладывают избыток сахара с расчётом на подачу при -12°C или +4°C). С другой стороны, холодный суп из холодильника не пахнет, так как давление насыщенного пара летучих молекул при +5°C минимально, а жир застыл.',
    factors: 'При сухой обжарке орехов, кунжута и специй (140–160°C) запускается реакция Штреккера (ветвь реакции Майяра), превращающая непахнущие аминокислоты в алкилпиразины с мощным жареным и ореховым ароматом.',
    practice: 'Если вы готовите блюдо для холодной подачи (паштет, террин, картофельный салат, окрошка, гаспачо), приправляйте его солью, кислотой и перцем примерно на 20% ярче в тёплом виде — после охлаждения до +6°C баланс выровняется.',
    mistakes: 'Дегустировать и окончательно солить суп в момент бурного кипения при 95°C: обожжённые сосочки не чувствуют тонкого баланса, и остывший до 60°C суп окажется пересоленным.',
    experiment: 'Попробуйте один и тот же сладкий ягодный морс или сыр в двух состояниях: прямо из холодильника (+4°C) и нагретым до комнатной температуры (+22°C). Тёплый образец покажется значительно слаще и ароматнее.',
    related: ['b1', 'e1', 'e2'],
    summary: 'Холод приглушает сладость и аромат (блюда холодной подачи солите и приправляйте смелее), а финальную пробу горячих блюд снимайте при температуре подачи (55–65°C).',
    sources: 'Talavera K. et al. (2005) «Heat activation of TRPM5 underlies thermal sensitivity of sweet taste», Nature.',
    quiz: { q: 'Почему растаявшее мороженое кажется приторно-сладким по сравнению с замороженным?', opts: ['Рецепторные ионные каналы TRPM5 на языке при 25–35°C передают сигнал сладости в несколько раз интенсивнее, чем при 0°C', 'При таянии лактоза превращается в чистую сахарозу', 'Холод испаряет воду из мороженого', 'В тепле пропадает молочный жир'], a: 0, exp: 'Каналы TRPM5 термочувствительны: холод подавляет их активность, поэтому рецептура мороженого содержит повышенную долю сахара.' }

  // --- РАЗДЕЛ Е: ФЕРМЕНТАЦИЯ И ХРАНЕНИЕ ---
  {

    idea: 'Молочнокислые бактерии выдерживают концентрацию соли 2–3%, подавляющую гнилостную микрофлору, и превращают сахара продукта в молочную кислоту, которая консервирует овощи и сворачивает казеин молока в нежный гель йогурта.',
    what: 'На поверхности свежих листьев капусты и огурцов живут бактерии Leuconostoc mesenteroides и Lactobacillus plantarum. Когда мы добавляем 2% соли и убираем доступ кислорода (под рассолом), аэробные плесени и гнилостные бактерии погибают, а галофильные лактобактерии начинают размножаться.',
    why: 'По мере накопления молочной кислоты pH рассола падает ниже 4.2, что полностью блокирует развитие патогенов (включая Clostridium botulinum). В молоке (при производстве йогурта на культурах L. bulgaricus и S. thermophilus при 40–43°C) молочная кислота нейтрализует отрицательный заряд казеиновых мицелл (до pH 4.6), и они сцепляются в пористую трёхмерную губку, удерживающую сыворотку.',
    factors: 'Точная дозировка соли для овощей: ровно 2–2.5% от общей массы овощей и воды. Меньше 1.5% — ферменты пектиназы размягчат капусту в слизь; больше 4% — затормозятся сами лактобактерии.',
    practice: 'При домашнем квашении взвешивайте овощи вместе с водой на кухонных весах и умножайте сумму на 0.02 (2% нейодированной соли). Следите, чтобы ни один кусочек не торчал над поверхностью рассола на воздухе.',
    mistakes: 'Нагревать домашний йогурт при сквашивании выше 48–50°C: термофильные культуры погибают или испытывают тепловой шок, а казеин сжимается с отделением кислой сыворотки.',
    experiment: 'Сквасьте две баночки тёплого молока с ложкой живого йогурта: одну из обычного пастеризованного молока, вторую из молока, которое вы предварительно прогрели до 85°C на 10 минут и остудили до 42°C. Вторая будет в полтора раза гуще (денатурированный сывороточный лактоглобулин встроится в каркас казеина).',
    related: ['a2', 'd4', 'f4'],
