name: Build APK

# main            → тестовая сборка (debug): артефакт + пререлиз «dev», который обновляется
# тег v1.2.3      → релиз: подписанные APK и AAB (для Google Play / RuStore)
# pull request    → только проверка, что всё собирается
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Кэширует дистрибутив Gradle и зависимости: меньше скачиваний, меньше сетевых сбоев
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm run build

      - name: Версия
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=$(node -p 'require("./package.json").version')-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - run: node scripts/prepare-android.mjs

      # ---------- Тестовая сборка ----------
      - name: Сборка debug APK
        if: env.IS_RELEASE != 'true'
        run: |
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/kuhnya-dev.apk"

      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE != 'true'
        with:
          name: kuhnya-dev-${{ env.VERSION_NAME }}
          path: kuhnya-dev.apk

      - name: Перенести тег dev на этот коммит
        if: env.IS_RELEASE != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f dev
          git push -f origin dev

      - uses: softprops/action-gh-release@v2
        if: env.IS_RELEASE != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: dev
          name: Тестовая сборка (main)
          body: |
            Автоматическая debug-сборка последнего коммита в main: версия ${{ env.VERSION_NAME }}, коммит ${{ github.sha }}.
            Для публикации в магазины используйте релизы с тегами v*.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: kuhnya-dev.apk

      # ---------- Релиз ----------
      - name: Сборка подписанных APK и AAB
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Не заданы секреты подписи ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD. См. docs/RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android && ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/kuhnya-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/kuhnya-$VERSION_NAME.aab"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        if: env.IS_RELEASE == 'true'
        with:
          name: Кухня ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: |
            kuhnya-${{ env.VERSION_NAME }}.apk
            kuhnya-${{ env.VERSION_NAME }}.aab
