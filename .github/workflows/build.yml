name: Build APK

# main            → тестовая сборка (debug): артефакт + пререлиз «dev», который обновляется
# тег v1.2.3      → релиз: подписанные APK и AAB (для Google Play / RuStore)
# pull request    → только проверка, что всё собирается
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Кэширует дистрибутив Gradle и зависимости: меньше скачиваний, меньше сетевых сбоев
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Версия нужна до сборки: она попадает в приложение (проверка обновлений)
      - name: Версия
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=$(node -p 'require("./package.json").version')-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - run: npm run build

      - run: node scripts/prepare-android.mjs

      # ---------- Тестовая сборка ----------
      - name: Сборка debug APK
        if: env.IS_RELEASE != 'true'
        run: |
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/kuhnya-dev.apk"

      # Все тестовые сборки должны быть подписаны одним ключом (debug.keystore из репозитория),
      # иначе новая сборка не устанавливается поверх предыдущей
      - name: Проверка подписи debug APK
        if: env.IS_RELEASE != 'true'
        run: |
          want=$(keytool -list -v -keystore debug.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile kuhnya-dev.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "ключ репозитория: $want"; echo "подпись APK:      $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then echo "::error::APK подписан не ключом debug.keystore"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE != 'true'
        with:
          name: kuhnya-dev-${{ env.VERSION_NAME }}
          path: kuhnya-dev.apk

      # Публикация через gh CLI: action softprops падал с «Error updating policy»
      - name: Опубликовать тестовую сборку «dev»
        if: env.IS_RELEASE != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev
          git push -f origin dev
          NOTES="Автоматическая debug-сборка последнего коммита в main: версия ${VERSION_NAME}, коммит ${GITHUB_SHA}.
          Для публикации в магазины используйте релизы с тегами v*."
          # Пока нет релизов v*, тестовая сборка помечается как Latest и видна в блоке Releases
          # на главной странице репозитория. После первого v* «последним» остаётся он.
          if gh release list --limit 100 --json tagName -q '.[].tagName' | grep -q '^v'; then
            FLAGS="--prerelease --latest=false"
          else
            FLAGS="--prerelease=false --latest"
          fi
          # Релиз пересоздаётся при каждой сборке: GitHub показывает дату публикации релиза,
          # и при простом обновлении в блоке Releases висела бы дата первой публикации.
          # Тег dev при удалении релиза сохраняется.
          gh release delete dev --yes 2>/dev/null || true
          gh release create dev kuhnya-dev.apk --title "Тестовая сборка ${VERSION_NAME}" --notes "$NOTES" $FLAGS --verify-tag

      # ---------- Релиз ----------
      - name: Сборка подписанных APK и AAB
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Не заданы секреты подписи ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD. См. docs/RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android && ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/kuhnya-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/kuhnya-$VERSION_NAME.aab"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Опубликовать релиз
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "kuhnya-$VERSION_NAME.apk" "kuhnya-$VERSION_NAME.aab" \
            --title "Кухня $VERSION_NAME" --generate-notes --verify-tag
