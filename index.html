  // --- РАЗДЕЛ А: ВЫПЕЧКА И ТЕСТО ---

    idea: 'Клейковина (глютен) не содержится в сухой муке в готовом виде — она образуется только при гидратации белков глиадина и глютенина и их механическом или временном выстраивании в вязкоупругую сеть.',

    summary: 'Вода запускает гидратацию глиадина и глютенина, время и складывания выстраивают сеть, соль её укрепляет, а масло укорачивает.',
    sources: 'Harold McGee «On Food and Cooking» (гл. 10); Calvel R. «The Taste of Bread».',
    quiz: { q: 'Какой белок муки отвечает преимущественно за упругость и сопротивление растяжению?', opts: ['Глютенин', 'Глиадин', 'Альбумин', 'Казеин'], a: 0, exp: 'Полимерный глютенин формирует длинные сшитые цепи, дающие тесту упругий возврат, тогда как глиадин обеспечивает растяжимость.' }

  {
    id: 'a2', sec: 'A', title: 'Дрожжевое брожение и симбиоз закваски',

    what: 'Фермент амилаза в муке расщепляет повреждённый крахмал до мальтозы и глюкозы. Дрожжи (Saccharomyces cerevisiae) метаболизируют глюкозу на CO2 (разрыхляет тесто) и этанол. В спонтанной закваске дикие дрожжи работают в симбиозе с бактериями Lactobacillus.',

    experiment: 'Разделите дрожжевое тесто на две части: одну выбродите 1.5 часа в тепле (28°C), вторую — 14 часов в холодильнике (4°C). Испеките одновременно и сравните цвет корочки (эффект остаточных сахаров для реакции Майяра) и аромат.',
    related: ['a1', 'a5', 'f1'],
    summary: 'Дрожжи дают объём за счёт CO2, а время, температура и лактобактерии управляют кислотностью, ароматом и скоростью черствения.',
    sources: 'Michael Gänzle (2014) «Enzymatic and bacterial conversions during sourdough fermentation»; Modernist Bread.',
    quiz: { q: 'Что происходит при холодной ферментации теста в холодильнике при +4°C?', opts: ['Активность дрожжей резко падает, но ферментативное накопление вкуса продолжается', 'Дрожжи полностью погибают', 'Клейковина мгновенно разрушается', 'Выделяется только уксусный альдегид'], a: 0, exp: 'При +4°C деление дрожжей практически останавливается, но амилазы и молочнокислые бактерии медленно формируют сахара и органические кислоты.' }

  {

    why: 'Фосфолипиды яичного желтка (лецитин) и белки горчицы встраиваются на границу раздела фаз: жирорастворимый хвост погружается в каплю масла, а водорастворимая заряженная голова смотрит в воду. Одноимённо заряженные капли отталкиваются друг от друга, и соус густеет, так как тесно упакованным каплям некуда двигаться.',
    factors: 'Критическое соотношение фаз: один желток способен удержать до 150–180 мл масла, но только если на старте есть минимум 1 ч. л. водной фазы (лимонного сока или воды), а масло вводится тонкой струйкой. В сливочных соусах (Beurre Blanc) при нагреве выше 65°C молочные белки сворачиваются, и масло отсекается.',

    summary: 'Парадокс эмульсии: чем больше жидкого масла вы вмешиваете в майонез, тем гуще он становится из-за тесной упаковки микрокапель.',

    why: 'Эволюционно каждый вкус решает задачу выживания: сладкий сигнализирует о быстрой энергии (углеводы), умами — о строительном белке (L-глутамат), солёный — о балансе электролитов, кислый предупреждает о незрелости или брожении, а горький (у которого 25 типов рецепторов T2R!) защищает от растительных токсинов и алкалоидов.',

  {

    what: 'Ненасыщенные жиры (особенно полиненасыщенные омега-3 и омега-6 в льняном, ореховом, подсолнечном масле и жирной рыбе) имеют двойные углеродные связи C=C. Фотоны света и тепло выбивают атом водорода у двойной связи, запускается цепная реакция с кислородом воздуха, образуются гидропероксиды, которые распадаются на летучие альдегиды и кетоны (гексаналь) с резким запахом старой масляной краски и картона.',
    why: 'Второй частый механизм порчи внешнего вида — ферментативное потемнение (яблоки, картофель, авокадо, бананы, грибы). При разрезе ножом разрушаются вакуоли клеток, и фермент полифенолоксидаза (ПФО) в присутствии кислорода окисляет бесцветные фенолы в коричневые меланины.',
    factors: 'Окисление жиров ускоряют ультрафиолет (прозрачные бутылки на подоконнике), нагрев (плита рядом со шкафом) и ионы металлов (медь, железо). Полифенолоксидаза в яблоках и авокадо блокируется кислотой (pH ниже 4.0), отсутствием кислорода (плёнка вконтакт или вода) или бланшированием при 80°C.',
    practice: 'Храните орехи, кунжут, мак, цельнозерновую муку и нерафинированные масла в тёмной таре в холодильнике (или морозилке для орехов — они не замерзают в камень из-за минимума воды, но не прогоркают годами).',

  {

    idea: 'Безопасность домашней кулинарии строится на правиле «правило 2–4 часов в зоне +4...+60°C» и понимании того, что споры ботулизма выживают при обычном кипячении (100°C) и прорастают в бескислородной среде с низкой кислотностью (pH выше 4.6).',
    what: 'В температурном коридоре от +4°C до +60°C («опасная зона») патогенные бактерии (Staphylococcus aureus, Salmonella, Clostridium perfringens, Bacillus cereus в варёном рисе) удваивают численность каждые 20 минут. При этом некоторые бактерии выделяют термостабильные токсины, которые НЕ разрушаются при повторном кипячении.',

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state = { ...state, ...saved };
    }
  } catch (e) {}
  applyThemeAndFont();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      theme: state.theme,
      fontScale: state.fontScale,
      readIds: state.readIds,
      favIds: state.favIds,
      quizScores: state.quizScores,
      journal: state.journal,
      recipeItems: state.recipeItems,
      bakerFlour: state.bakerFlour,
      bakerItems: state.bakerItems
    }));
  } catch (e) {}
}

function applyThemeAndFont() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.style.setProperty('--font-scale', state.fontScale);
}

function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  applyThemeAndFont();
  saveState();
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ==================== 5. НАВИГАЦИЯ И РЕНДЕРИНГ ЭКРАНОВ ====================
function navigate(tab, param = null) {
  state.tab = tab;
  if (tab === 'catalog' && param) {
    state.secFilter = param;
  }
  if (tab === 'article' && param) {
    state.currentArticleId = param;
  }
  document.querySelectorAll('.nav-item').forEach(btn => {
    const t = btn.getAttribute('data-tab');
    btn.classList.toggle('active', t === tab || (tab === 'article' && t === 'catalog') || (tab === 'favorites' && t === 'settings'));
  });
  window.scrollTo({ top: 0, behavior: 'instant' });
  render();
}

function render() {
  const el = document.getElementById('app-Main');
  if (state.tab === 'home') el.innerHTML = renderHome();
  else if (state.tab === 'catalog') el.innerHTML = renderCatalog();
  else if (state.tab === 'article') el.innerHTML = renderArticle();
  else if (state.tab === 'tools') el.innerHTML = renderTools();
  else if (state.tab === 'lab') el.innerHTML = renderLab();
  else if (state.tab === 'favorites') el.innerHTML = renderFavorites();
  else if (state.tab === 'settings') el.innerHTML = renderSettings();
}

function quickSearchFromHome(val) {
  state.searchQuery = val;
  state.secFilter = 'ALL';
  navigate('catalog');
  setTimeout(() => {
    const inp = document.getElementById('catSearchInput');
    if (inp) { inp.focus(); inp.setSelectionRange(val.length, val.length); }
  }, 10);
}

function renderCatalog() {
  const q = state.searchQuery.trim().toLowerCase();
  const filtered = ARTICLES.filter(a => {
    if (state.secFilter !== 'ALL' && state.secFilter !== 'UNREAD' && a.sec !== state.secFilter) return false;
    if (state.secFilter === 'UNREAD' && state.readIds.includes(a.id)) return false;
    if (!q) return true;
    const hay = `${a.title} ${a.idea} ${a.what} ${a.why} ${a.practice} ${a.mistakes} ${a.summary}`.toLowerCase();
    return hay.includes(q);
  });

  return `
    <input type="search" id="catSearchInput" class="search-box"
      placeholder="🔍 Поиск по 36 статьям, терминам и процессам..."
      value="${escapeHtml(state.searchQuery)}"
      oninput="state.searchQuery=this.value;renderCatalogListOnly()">

    <div class="pill-bar">
      <button class="pill ${state.secFilter==='ALL'?'active':''}" onclick="state.secFilter='ALL';render()">Все (${ARTICLES.length})</button>
      <button class="pill ${state.secFilter==='UNREAD'?'active':''}" onclick="state.secFilter='UNREAD';render()">Непрочитанные</button>
      ${SECTIONS.map(s => `
        <button class="pill ${state.secFilter===s.id?'active':''}" onclick="state.secFilter='${s.id}';render()">
          ${s.letter}. ${escapeHtml(s.title)}
        </button>
      `).join('')}
    </div>

    <div id="catalogListContainer">
      ${renderCatalogCards(filtered)}
    </div>
  `;
}

function renderCatalogListOnly() {
  const q = state.searchQuery.trim().toLowerCase();
  const filtered = ARTICLES.filter(a => {
    if (state.secFilter !== 'ALL' && state.secFilter !== 'UNREAD' && a.sec !== state.secFilter) return false;
    if (state.secFilter === 'UNREAD' && state.readIds.includes(a.id)) return false;
    if (!q) return true;
    const hay = `${a.title} ${a.idea} ${a.what} ${a.why} ${a.practice} ${a.mistakes} ${a.summary}`.toLowerCase();
    return hay.includes(q);
  });
  const box = document.getElementById('catalogListContainer');
  if (box) box.innerHTML = renderCatalogCards(filtered);
}

function renderCatalogCards(list) {
  if (!list.length) {
    return `<div class="card" style="text-align:center;padding:28px;">
      <div style="font-size:1.8rem;margin-bottom:8px;">🔎</div>
      <strong>Ничего не найдено</strong>
      <p style="color:var(--text-muted);font-size:0.88rem;">Попробуйте изменить поисковый запрос или выбрать фильтр «Все».</p>
      <button class="btn outline" onclick="state.searchQuery='';state.secFilter='ALL';render()">Сбросить фильтры</button>
    </div>`;
  }
  return list.map(a => {
    const sec = SECTIONS.find(s => s.id === a.sec);
    const isRead = state.readIds.includes(a.id);
    const isFav = state.favIds.includes(a.id);
    return `
      <div class="card card-clickable" onclick="navigate('article', '${a.id}')">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span class="tag terra">Раздел ${sec.letter}: ${escapeHtml(sec.title)}</span>
          <div>
            ${isFav ? '<span class="tag" style="color:var(--warn)">★ В избранном</span>' : ''}
            ${isRead ? '<span class="tag olive">✓ Изучено</span>' : ''}
          </div>
        </div>
        <div style="font-weight:800;font-size:1.02rem;margin-bottom:6px;">${escapeHtml(a.title)}</div>
        <div style="font-size:0.86rem;color:var(--text-muted);">${escapeHtml(a.idea)}</div>
      </div>
    `;
  }).join('');
}

// --- ЭКРАН 3: СТРАНИЦА СТАТЬИ ---
function renderArticle() {
  const a = ARTICLES.find(x => x.id === state.currentArticleId) || ARTICLES[0];
  const sec = SECTIONS.find(s => s.id === a.sec);
  const isRead = state.readIds.includes(a.id);
  const isFav = state.favIds.includes(a.id);
  const relArts = (a.related || []).map(rid => ARTICLES.find(x => x.id === rid)).filter(Boolean);
  const qAns = state.quizScores[a.id];

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <button class="btn outline" style="padding:8px 12px;" onclick="navigate('catalog', '${a.sec}')">← К разделу ${sec.letter}</button>
      <div style="display:flex;gap:6px;">
        <button class="btn ${isFav?'':'outline'}" style="padding:8px 12px;" onclick="toggleFav('${a.id}')">
          ${isFav ? '★ В избранном' : '☆ В избранное'}
        </button>
        <button class="btn ${isRead?'secondary':'outline'}" style="padding:8px 12px;" onclick="toggleRead('${a.id}')">
          ${isRead ? '✓ Прочитано' : 'Отметить прочитанным'}
        </button>
      </div>
    </div>

    <div class="card" style="border-left:4px solid var(--primary);">
      <span class="tag terra">Раздел ${sec.letter} • ${escapeHtml(sec.title)}</span>
      <h2 style="margin:6px 0 10px 0;font-size:1.25rem;line-height:1.3;">${escapeHtml(a.title)}</h2>
      <div style="font-weight:600;color:var(--text);">💡 Главная идея: ${escapeHtml(a.idea)}</div>
    </div>

    <div class="art-block">
      <h4>1. Что происходит</h4>
      <div>${escapeHtml(a.what)}</div>
    </div>

    <div class="art-block">
      <h4>2. Почему это происходит (Научный механизм)</h4>
      <div>${escapeHtml(a.why)}</div>
    </div>

    <div class="art-block olive">
      <h4>3. Что влияет на результат</h4>
      <div>${escapeHtml(a.factors)}</div>
    </div>

    <div class="art-block olive">
      <h4>4. Как применить на практике</h4>
      <div>${escapeHtml(a.practice)}</div>
    </div>

    <div class="art-block warn">
      <h4>5. Типичные ошибки и как их избежать</h4>
      <div>${escapeHtml(a.mistakes)}</div>
    </div>

    <div class="art-block">
      <h4>6. Небольшой домашний эксперимент</h4>
      <div>🧪 ${escapeHtml(a.experiment)}</div>
    </div>

    <div class="art-block Summary">
      <h4>7. Краткий вывод (Запомнить)</h4>
      <div style="font-weight:700;">📌 ${escapeHtml(a.summary)}</div>
      <div style="margin-top:8px;font-size:0.76rem;color:var(--text-muted);">
        📚 Источники: ${escapeHtml(a.sources)}
      </div>
    </div>

    <div class="card">
      <h4 style="margin:0 0 8px 0;color:var(--primary);">🧠 Проверьте понимание статьи</h4>
      <div style="font-weight:700;margin-bottom:10px;">${escapeHtml(a.quiz.q)}</div>
      ${a.quiz.opts.map((opt, idx) => {
        let cls = 'quiz-opt';
        if (qAns !== undefined) {
          if (idx === a.quiz.a) cls += ' correct';
          else if (idx === qAns) cls += ' wrong';
        }
        return `<button class="${cls}" onclick="answerArticleQuiz('${a.id}', ${idx})">${escapeHtml(opt)}</button>`;
      }).join('')}
      ${qAns !== undefined ? `
        <div style="margin-top:8px;padding:10px;border-radius:10px;background:var(--surface-alt);font-size:0.86rem;">
          <strong>Разбор:</strong> ${escapeHtml(a.quiz.exp)}
        </div>
      ` : ''}
    </div>

    <div class="card">
      <h4 style="margin:0 0 8px 0;">🔗 Связанные темы</h4>
      ${relArts.map(ra => `
        <div style="padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;color:var(--primary);font-weight:600;"
             onclick="navigate('article', '${ra.id}')">
          → ${escapeHtml(ra.title)}
        </div>
      `).join('')}
    </div>
  `;
}

function toggleFav(id) {
  const idx = state.favIds.indexOf(id);
  if (idx >= 0) state.favIds.splice(idx, 1);
  else state.favIds.push(id);
  saveState();
  render();
}

function toggleRead(id) {
  const idx = state.readIds.indexOf(id);
  if (idx >= 0) state.readIds.splice(idx, 1);
  else state.readIds.push(id);
  saveState();
  render();
}

function answerArticleQuiz(id, optIdx) {
  state.quizScores[id] = optIdx;
  if (!state.readIds.includes(id)) state.readIds.push(id);
  saveState();
  render();
}

// --- ЭКРАН 4: ИНСТРУМЕНТЫ (КАЛЬКУЛЯТОР, ОШИБКИ, СРАВНЕНИЯ) ---
function renderTools() {
  return `
    <div class="pill-bar">
      <button class="pill ${state.subTab==='calc'?'active':''}" onclick="state.subTab='calc';render()">⚖️ Калькулятор и % пекаря</button>
      <button class="pill ${state.subTab==='trouble'?'active':''}" onclick="state.subTab='trouble';render()">🩺 Разбор ошибок (${TROUBLESHOOTING.length})</button>
      <button class="pill ${state.subTab==='compare'?'active':''}" onclick="state.subTab='compare';render()">⚡ Сравнение техник (${COMPARISONS.length})</button>
    </div>
    ${state.subTab === 'calc' ? renderCalculator() : state.subTab === 'trouble' ? renderTroubleshooting() : renderComparisons()}
  `;
}

function renderCalculator() {
  const ratio = (parseFloat(state.targetPortions) || 1) / (parseFloat(state.basePortions) || 1);
  const flourMass = parseFloat(state.bakerFlour) || 500;
  let totalBakerPct = 100;
  state.bakerItems.forEach(it => totalBakerPct += (parseFloat(it.pct) || 0));
  const totalDoughWeight = Math.round(flourMass * (totalBakerPct / 100));

  return `
    <div class="card">
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <button class="btn ${state.calcMode==='portions'?'':'outline'} full" onclick="state.calcMode='portions';render()">Пересчёт порций</button>
        <button class="btn ${state.calcMode==='baker'?'':'outline'} full" onclick="state.calcMode='baker';render()">Проценты пекаря (Мука=100%)</button>
      </div>

      ${state.calcMode === 'portions' ? `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
          <div>
            <label style="font-size:0.78rem;color:var(--text-muted)">Исходных порций</label>
            <input type="number" class="field" min="1" step="1" value="${state.basePortions}"
              oninput="state.basePortions=this.value;render()">
          </div>
          <div>
            <label style="font-size:0.78rem;color:var(--text-muted)">Нужно порций (×${ratio.toFixed(2)})</label>
            <input type="number" class="field" min="1" step="1" value="${state.targetPortions}"
              oninput="state.targetPortions=this.value;render()">
          </div>
        </div>

        <h4 style="margin:0 0 8px 0;">Ингредиенты (Исходное → Пересчёт)</h4>
        ${state.recipeItems.map((it, i) => {
          const scaled = Math.round((parseFloat(it.amount) || 0) * ratio * 10) / 10;
          return `
            <div class="input-row">
              <input class="field" value="${escapeHtml(it.name)}" onchange="state.recipeItems[${i}].name=this.value;saveState()">
              <input type="number" class="field" value="${it.amount}" oninput="state.recipeItems[${i}].amount=this.value;saveState();render()">
              <select class="field" onchange="state.recipeItems[${i}].unit=this.value;saveState();render()">
                <option value="г" ${it.unit==='г'?'selected':''}>г</option>
                <option value="мл" ${it.unit==='мл'?'selected':''}>мл</option>
                <option value="шт" ${it.unit==='шт'?'selected':''}>шт</option>
              </select>
              <button class="icon-btn" onclick="state.recipeItems.splice(${i},1);saveState();render()">✕</button>
            </div>
            <div style="font-size:0.82rem;color:var(--secondary);font-weight:700;margin:-4px 0 10px 4px;">
              Итог: ${it.amount} ${it.unit} → <strong>${scaled} ${it.unit}</strong>
            </div>
          `;
        }).join('')}
        <button class="btn outline full" onclick="state.recipeItems.push({name:'Новый ингредиент',amount:100,unit:'г'});saveState();render()">+ Добавить ингредиент</button>
      ` : `
        <div class="art-block olive" style="margin-bottom:12px;">
          <h4>Формула пекаря</h4>
          <div style="font-size:0.85rem;">Масса всей муки всегда принимается за <strong>100%</strong>. Все остальные ингредиенты выражаются в процентах от массы муки.</div>
        </div>
        <div style="margin-bottom:14px;">
          <label style="font-size:0.82rem;font-weight:700;">Базовая масса муки (100%), в граммах:</label>
          <input type="number" class="field" value="${state.bakerFlour}" oninput="state.bakerFlour=this.value;saveState();render()">
        </div>
        ${state.bakerItems.map((it, i) => {
          const grams = Math.round(flourMass * ((parseFloat(it.pct) || 0) / 100) * 10) / 10;
          return `
            <div style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:8px;">
              <input class="field" value="${escapeHtml(it.name)}" onchange="state.bakerItems[${i}].name=this.value;saveState()">
              <input type="number" step="0.5" class="field" value="${it.pct}" oninput="state.bakerItems[${i}].pct=this.value;saveState();render()">
              <div style="font-weight:800;color:var(--primary);text-align:right;">${grams} г</div>
              <button class="icon-btn" onclick="state.bakerItems.splice(${i},1);saveState();render()">✕</button>
            </div>
          `;
        }).join('')}
        <button class="btn outline full" style="margin-bottom:10px;" onclick="state.bakerItems.push({name:'Добавка',pct:5});saveState();render()">+ Добавить компонент (%)</button>
        <div style="padding:12px;border-radius:12px;background:var(--secondary-soft);font-weight:700;">
          Итоговая масса теста: ${totalDoughWeight} г (${totalBakerPct.toFixed(1)}% от муки)
        </div>
      `}
    </div>
  `;
}

function renderTroubleshooting() {
  return TROUBLESHOOTING.map(t => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <h3 style="margin:0 0 8px 0;font-size:1.05rem;color:var(--danger);">⚠️ ${escapeHtml(t.title)}</h3>
      </div>
      <div style="font-size:0.88rem;margin-bottom:8px;">
        <strong>Вероятные причины:</strong>
        <ul style="margin:4px 0;padding-left:18px;">
          ${t.causes.map(c => `<li>${escapeHtml(c)}</li>`).join('')}
        </ul>
      </div>
      <div style="font-size:0.88rem;margin-bottom:8px;padding:8px 10px;border-radius:10px;background:var(--surface-alt);">
        <strong>🔍 Диагностика:</strong> ${escapeHtml(t.diag)}
      </div>
      <div style="font-size:0.88rem;padding:8px 10px;border-radius:10px;background:var(--secondary-soft);">
        <strong>✅ Решение:</strong> ${escapeHtml(t.fix)}
      </div>
      <button class="btn outline" style="margin-top:10px;padding:7px 12px;font-size:0.8rem;" onclick="navigate('article','${t.rel}')">
        Открыть научную статью по теме →
      </button>
    </div>
  `).join('');
}

function renderComparisons() {
  return COMPARISONS.map(c => `
    <div class="card" style="overflow-x:auto;">
      <h3 style="margin:0 0 8px 0;font-size:1.02rem;color:var(--primary);">⚡ ${escapeHtml(c.title)}</h3>
      <table class="comp-table">
        <thead>
          <tr>${c.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${c.rows.map(r => `<tr>${r.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}

// --- ЭКРАН 5: ПРАКТИКА (ТЕСТЫ И ЖУРНАЛ ЭКСПЕРИМЕНТОВ) ---
function renderLab() {
  const solvedCount = Object.keys(state.quizScores).length;
  const correctCount = Object.entries(state.quizScores).filter(([aid, ans]) => {
    const art = ARTICLES.find(x => x.id === aid);
    return art && art.quiz.a === ans;
  }).length;

  return `
    <div class="pill-bar">
      <button class="pill ${state.labTab==='quiz'?'active':''}" onclick="state.labTab='quiz';render()">🧠 Тренажёр и тесты (${correctCount}/${ARTICLES.length})</button>
      <button class="pill ${state.labTab==='journal'?'active':''}" onclick="state.labTab='journal';render()">📓 Журнал экспериментов (${state.journal.length})</button>
    </div>

    ${state.labTab === 'quiz' ? `
      <div class="card" style="background:var(--secondary-soft);">
        <strong>Ваш результат: ${correctCount} верных из ${solvedCount} пройденных (всего ${ARTICLES.length} вопросов)</strong>
        <div style="font-size:0.84rem;margin-top:4px;">Отвечайте на вопросы ниже, чтобы закрепить химию и физику процессов.</div>
      </div>
      ${ARTICLES.map((a, idx) => {
        const userAns = state.quizScores[a.id];
        return `
          <div class="card">
            <span class="tag terra">Вопрос №${idx + 1} • ${escapeHtml(a.title)}</span>
            <div style="font-weight:700;margin:6px 0 10px 0;">${escapeHtml(a.quiz.q)}</div>
            ${a.quiz.opts.map((opt, oIdx) => {
              let cls = 'quiz-opt';
              if (userAns !== undefined) {
                if (oIdx === a.quiz.a) cls += ' correct';
                else if (oIdx === userAns) cls += ' wrong';
              }
              return `<button class="${cls}" onclick="answerArticleQuiz('${a.id}', ${oIdx})">${escapeHtml(opt)}</button>`;
            }).join('')}
            ${userAns !== undefined ? `
              <div style="font-size:0.84rem;padding:8px 10px;background:var(--surface-alt);border-radius:10px;">
                <strong>Объяснение:</strong> ${escapeHtml(a.quiz.exp)}
              </div>
            ` : ''}
          </div>
        `;
      }).join('')}
    ` : renderJournal()}
  `;
}

function renderJournal() {
  return `
    <div class="card">
      <h3 style="margin:0 0 10px 0;font-size:1.05rem;">➕ Новая запись в журнал экспериментов</h3>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <input id="jDish" class="field" placeholder="Что готовили (например: Стейк рибай / Хлеб на закваске)">
        <textarea id="jIng" class="field" rows="2" placeholder="Ингредиенты и точные пропорции (граммы, % соли, гидратация)"></textarea>
        <input id="jTemp" class="field" placeholder="Температура и время (внутри куска, духовка, расстойка)">
        <textarea id="jRes" class="field" rows="2" placeholder="Что получилось (текстура, корочка, сочность, ошибки)"></textarea>
        <textarea id="jNext" class="field" rows="2" placeholder="Что изменить в следующий раз (гипотеза)"></textarea>
        <button class="btn full" onclick="addJournalEntry()">Сохранить эксперимент на устройстве</button>
      </div>
    </div>

    ${state.journal.map((item, idx) => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span class="tag olive">📅 ${escapeHtml(item.date)}</span>
          <button class="icon-btn" onclick="deleteJournalEntry(${idx})">🗑️</button>
        </div>
        <h4 style="margin:0 0 6px 0;font-size:1.02rem;">${escapeHtml(item.dish)}</h4>
        <div style="font-size:0.86rem;margin-bottom:4px;"><strong>⚖️ Пропорции:</strong> ${escapeHtml(item.ing)}</div>
        <div style="font-size:0.86rem;margin-bottom:4px;"><strong>🌡️ Режим:</strong> ${escapeHtml(item.temp)}</div>
        <div style="font-size:0.86rem;margin-bottom:4px;"><strong>🔬 Результат:</strong> ${escapeHtml(item.result)}</div>
        <div style="font-size:0.86rem;padding:8px;border-radius:8px;background:var(--primary-soft);">
          <strong>🚀 На следующий раз:</strong> ${escapeHtml(item.next)}
        </div>
      </div>
    `).join('')}
  `;
}

function addJournalEntry() {
  const dish = document.getElementById('jDish').value.trim();
  if (!dish) { alert('Укажите название блюда или эксперимента'); return; }
  const now = new Date().toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric' });
  state.journal.unshift({
    id: Date.now(),
    date: now,
    dish,
    ing: document.getElementById('jIng').value.trim() || '—',
    temp: document.getElementById('jTemp').value.trim() || '—',
    result: document.getElementById('jRes').value.trim() || '—',
    next: document.getElementById('jNext').value.trim() || '—'
  });
  saveState();
  render();
}

function deleteJournalEntry(idx) {
  state.journal.splice(idx, 1);
  saveState();
  render();
}

// --- ЭКРАН 6: ИЗБРАННОЕ И НАСТРОЙКИ ---
function renderFavorites() {
  const favArts = ARTICLES.filter(a => state.favIds.includes(a.id));
  return `
    <h3 style="margin:0 0 12px 0;">★ Избранные статьи (${favArts.length})</h3>
    ${favArts.length ? renderCatalogCards(favArts) : `
      <div class="card" style="text-align:center;padding:24px;">
        <div style="font-size:1.8rem;">☆</div>
        <p>В избранном пока нет статей. Откройте любую статью и нажмите «В избранное».</p>
        <button class="btn" onclick="navigate('catalog','ALL')">Перейти к статьям</button>
      </div>

}

          <button class="icon-btn" onclick="toggleFav('${a.id}')">✕</button>

      <h3 style="margin:0 0 10px 0;">🎨 Оформление и читаемость</h3>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <span>Цветовая тема</span>
        <button class="btn outline" onclick="toggleTheme();render()">
          ${state.theme === 'light' ? '☀️ Светлая (Тёплый крем)' : '🌙 Тёмная (Графит)'}
        </button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span>Размер шрифта</span>
        <div style="display:flex;gap:6px;">
          <button class="btn ${state.fontScale===0.95?'':'outline'}" onclick="state.fontScale=0.95;applyThemeAndFont();saveState();render()">А-</button>
          <button class="btn ${state.fontScale===1?'':'outline'}" onclick="state.fontScale=1;applyThemeAndFont();saveState();render()">100%</button>
          <button class="btn ${state.fontScale===1.12?'':'outline'}" onclick="state.fontScale=1.12;applyThemeAndFont();saveState();render()">А+</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px 0;">💾 Локальные данные (100% Офлайн)</h3>
      <p style="font-size:0.85rem;color:var(--text-muted);margin-top:0;">
        Все ваши заметки в журнале, прочитанные статьи и избранное хранятся исключительно в памяти вашего смартфона.
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn outline" onclick="exportBackup()">Экспорт JSON</button>
        <button class="btn outline" onclick="resetProgress()">Сбросить прогресс чтения</button>
      </div>
      <textarea id="backupArea" class="field" rows="3" style="margin-top:10px;display:none;" placeholder="Резервная копия данных JSON"></textarea>
    </div>
  `;
}

function exportBackup() {
  const area = document.getElementById('backupArea');
  area.style.display = 'block';
  area.value = localStorage.getItem(STORAGE_KEY) || '{}';
  area.select();
}

function resetProgress() {
  if (confirm('Сбросить отметки о прочитанных статьях и тестах? Записи журнала и избранное сохранятся.')) {
    state.readIds = [];
    state.quizScores = {};
    saveState();
    render();
  }
}

loadState();
render();
</script>
</body>
</html>
